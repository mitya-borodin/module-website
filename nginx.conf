server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Относительный Location сохраняет HTTPS и внешний порт за ingress.
  absolute_redirect off;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Astro выпускает отдельные HTML-страницы; неизвестный URL должен дать 404.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
