name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  check:
    # Чужой fork не должен исполнять код на доверенном self-hosted runner.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install Yarn
        run: |
          npm install --global --prefix "$RUNNER_TEMP/yarn" yarn@1.22.22
          echo "$RUNNER_TEMP/yarn/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --cache-folder "$RUNNER_TEMP/yarn-cache"
      - name: Check and build Astro
        run: yarn build

  build:
    runs-on: self-hosted
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/mitya-borodin/module-website:${{ github.sha }}
      - name: Test static HTTP server
        run: sh scripts/test-container.sh ghcr.io/mitya-borodin/module-website:${{ github.sha }}
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/mitya-borodin/module-website:${{ github.sha }}
          docker tag ghcr.io/mitya-borodin/module-website:${{ github.sha }} ghcr.io/mitya-borodin/module-website:latest
          docker push ghcr.io/mitya-borodin/module-website:latest

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: module-website-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy website container
        uses: D3rHase/ssh-command-action@v0.3.1
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          host_fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Action передаёт COMMAND через word splitting; нужны явные разделители.
          command: |
            set -eu;
            export GITHUB_SHA='${{ github.sha }}';
            cd '${{ secrets.PROJECT_FOLDER }}';
            test -z "$(git status --porcelain)";
            git fetch origin "$GITHUB_SHA";
            git checkout --detach "$GITHUB_SHA";
            docker network inspect module_cloud_network >/dev/null;
            DOCKER_CONFIG=$(mktemp -d);
            export DOCKER_CONFIG;
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT;
            printf '%s\n' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin;
            docker compose pull module_website;
            docker compose up -d --no-deps --wait --wait-timeout 120 module_website;
