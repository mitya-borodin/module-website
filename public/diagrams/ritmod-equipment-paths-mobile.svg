<rect x="26" y="208" width="268" height="48" rx="12" fill="#244657" stroke="#75b7d2"/>
<text x="160" y="228" text-anchor="middle" fill="#f4f7f6" font-family="Arial, sans-serif" font-size="13" font-weight="600">MQTT → входной слой Ritmod</text><text x="160" y="245" text-anchor="middle" fill="#c6d5d6" font-family="Arial, sans-serif" font-size="12">работает</text>
</g>
<g transform="translate(0 615)">
