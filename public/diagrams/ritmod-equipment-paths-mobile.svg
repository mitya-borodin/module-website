<text x="18" y="1119" fill="#c7d4d7" font-family="Arial, sans-serif" font-size="12">Работают: Wiren Board и Zigbee.</text>
<text x="18" y="1139" fill="#c7d4d7" font-family="Arial, sans-serif" font-size="12">Пунктирная — Z-Wave, AV и KNX в разработке.</text>
