<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1100" role="img" aria-labelledby="title description">
<title id="title">Мобильная схема подключений устройств Ritmod</title>
<desc id="description">Пять маршрутов в порядке: Wiren Board, Zigbee, Z-Wave, AV-ресивер, KNX. Каждая строка показывает физическое подключение, сервис, вход MQTT в Ritmod и статус. Wiren Board и Zigbee работают; Z-Wave, AV и KNX в разработке.</desc>
<style>.service-text { fill: #f4f7f6; font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }</style>
<rect width="320" height="1100" rx="24" fill="#111b22"/>
<g transform="translate(0 -60)">
<g>
<rect x="14" y="80" width="292" height="190" rx="18" fill="#17272d" stroke="#75b7d2" stroke-width="2"/>
<rect x="26" y="90" width="268" height="45" rx="12" fill="#294638" stroke="#83bb91"/>
