<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1094" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Мобильная схема пути данных Ritmod</title>
<desc id="diagram-desc">Оборудование передаёт наблюдения через MQTT broker в Ritmod. От общего состояния данные идут в GUI и фоновые автоматизации. Автоматизация отправляет команду через тот же MQTT broker и контроллер к исполнительному устройству. Один broker показан в схеме дважды, чтобы отдельно показать входной и обратный пути.</desc>
<defs>
  <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#72d1e7"/></marker>
  <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ffbc7d"/></marker>
  <marker id="config" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c3aeff"/></marker>
  <marker id="store" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9db8c0"/></marker>
</defs>
